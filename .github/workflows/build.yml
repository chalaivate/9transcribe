name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore 9Transcribe.sln

      - name: Build
        run: dotnet build 9Transcribe.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/9Transcribe.Tests/9Transcribe.Tests.csproj -c Release --no-build --verbosity normal

      # Portable: carries the whole .NET runtime, runs on any 64-bit Windows with nothing installed.
      # Deliberately uncompressed: a compressed bundle is unpacked into private memory at start-up
      # (measured: ~98 MB private working set against ~16 MB), while the download is zipped anyway.
      - name: Publish Portable
        run: >
          dotnet publish src/9Transcribe/9Transcribe.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=false
          -o publish/portable

      # Lite: just the app; uses the .NET Desktop Runtime installed on the machine.
      - name: Publish Lite
        run: >
          dotnet publish src/9Transcribe/9Transcribe.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o publish/lite

      # Only for the memory comparison below; not uploaded.
      - name: Publish compressed Portable (comparison only)
        run: >
          dotnet publish src/9Transcribe/9Transcribe.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o publish/portable-compressed

      - name: Report artifact sizes and hashes
        shell: pwsh
        run: |
          foreach ($build in 'portable', 'lite') {
            $exe = Get-Item "publish/$build/9Transcribe.exe"
            "{0}: {1:N1} MB" -f $build, ($exe.Length / 1MB)
            Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List
          }

      # Informational only: a failure here must never block the artifacts.
      - name: Measure memory
        continue-on-error: true
        shell: pwsh
        run: |
          ./tools/measure-memory.ps1 -Header -Label 'Portable' -Path publish/portable/9Transcribe.exe
          ./tools/measure-memory.ps1 -Label 'Lite' -Path publish/lite/9Transcribe.exe
          ./tools/measure-memory.ps1 -Label 'Portable, compressed (not shipped)' -Path publish/portable-compressed/9Transcribe.exe

      - uses: actions/upload-artifact@v4
        with:
          name: 9Transcribe-portable-win-x64
          path: publish/portable/9Transcribe.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: 9Transcribe-lite-win-x64
          path: publish/lite/9Transcribe.exe
          if-no-files-found: error

      - name: Name release files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item publish/portable/9Transcribe.exe release/9Transcribe-Portable.exe
          Copy-Item publish/lite/9Transcribe.exe release/9Transcribe-Lite.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/9Transcribe-Portable.exe
            release/9Transcribe-Lite.exe
          generate_release_notes: true
