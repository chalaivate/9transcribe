name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore 9Transcribe.sln

      - name: Build
        run: dotnet build 9Transcribe.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/9Transcribe.Tests/9Transcribe.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish portable exe
        run: >
          dotnet publish src/9Transcribe/9Transcribe.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: Report artifact size and hash
        shell: pwsh
        run: |
          $exe = Get-Item publish/9Transcribe.exe
          "size: {0:N1} MB" -f ($exe.Length / 1MB)
          Get-FileHash $exe.FullName -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: 9Transcribe-win-x64
          path: publish/9Transcribe.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/9Transcribe.exe
          generate_release_notes: true
